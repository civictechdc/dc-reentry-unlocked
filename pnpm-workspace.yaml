packages:
  - apps/web
  - apps/api
  - packages/shared
  - tools/datagen

# dependency-cruiser parses TypeScript through the compiler programmatic API,
# which TypeScript 7 (Go-native) does not ship; dependency-cruiser 18 accepts
# typescript >= 2.0.0 < 7.0.0 (verified in its generated meta.cjs) and resolves
# a package literally named `typescript` at runtime. Pin its parser to the
# TS 6.0 compiler packaged as @typescript/typescript6 (the same TS 6 pinned
# for apps/web) via the npm alias protocol.
# (overrides cannot express this: dependency-cruiser does not declare
# `typescript`, so there is no edge to rewrite; packageExtensions adds it.)
packageExtensions:
  dependency-cruiser:
    optionalDependencies:
      typescript: "npm:@typescript/typescript6@6.0.2"

# Vite/Playwright toolchains ship build scripts (esbuild platform binary,
# browser binary downloads); the web devDependencies are the only sources.
allowBuilds:
  esbuild: true

# Supply-chain release-age policy carve-outs: pnpm's minimumReleaseAge check
# rejects these two exact pins (published-by-registry timestamps), while the
# peer graph requires exactly these versions (verified 2026-10-29). Kept
# narrow: exact name@version pairs only.
minimumReleaseAgeExclude:
  - "@inlang/plugin-message-format@4.5.6"
  - "@inlang/sdk@4.1.0"
