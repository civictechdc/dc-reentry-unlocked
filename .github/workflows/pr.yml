# Pull-request gate: the full local-equivalent check sequence plus the
# compose-backed e2e matrix. Gate design:
# - `checks` — deterministic repo checks in the documented order. pnpm comes
#   from the official pnpm/setup action (project-pinned pnpm via
#   packageManager; cache: true caches the pnpm store), with an explicit
#   frozen install for determinism. apps/api has no build step (tsx at
#   runtime); apps/web is built from source with the adapter-node output.
# - `e2e` — Docker Compose boots API + production-built web (healthchecked,
#   `--wait`), then the Playwright browser matrix runs against it: the spec
#   suite and the generated BDD golden paths across Chromium/WebKit/Firefox
#   desktop + Chromium mobile. Chromium launches with software GL
#   (--use-gl=angle --use-angle=swiftshader) so the MapLibre WebGL2 canvas
#   renders on runner hosts; WebKit sets the mesa software-GL env, and
#   Firefox runs headed under Xvfb (headless Firefox on Linux has no WebGL2
#   path).
# - commitlint is the single engine for PR title + PR commit range
#   (official commitlint CI pattern); e2e artifacts upload on failure only.

name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, arch, tests, build, gate
    runs-on: ubuntu-24.04
    # A stalled step should not consume runner hours; the local equivalents
    # of every step here finish well inside 10 minutes on a laptop
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for the commitlint PR range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm + Node.js (pinned via package.json packageManager)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # STRICT AGAINST NEW ADVISORY IDS: any GHSA not in the accepted list
      # fails the PR. Note the accepted list (pnpm-workspace.yaml
      # `audit.ignore`) applies to EVERY audit including this one — if one of
      # those six dev-chain advisories ever appears under a production
      # dependency, this step would silently pass it; review the ignore
      # entries whenever adding production dependencies.
      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Commit messages (PR range)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Lint (oxlint + ESLint on JSON)
        run: pnpm lint

      - name: Format check (oxfmt)
        run: pnpm format:check

      - name: Compile Paraglide messages (fresh checkout has no i18n tree)
        # src/lib/paraglide/ is generated (self-gitignored) — the vite plugin
        # only emits it during dev/build, so a fresh checkout cannot
        # typecheck without this compile step. The flags mirror the plugin's
        # dev-server output; --output-structure locale-modules is the
        # plugin's NON-production default (the CLI default is
        # message-modules; production builds also emit message-modules) and
        # is the structure svelte-check is verified against — keep it in
        # sync with the plugin's dev output. The symlink guard refuses a
        # symlinked outdir: the compiler's clean-outdir seeding follows
        # symlinks, and a PR-supplied link must not widen it.
        run: |
          test ! -L apps/web/src/lib/paraglide || { echo "refusing symlinked paraglide outdir"; exit 1; }
          pnpm -C apps/web exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --strategy url cookie baseLocale --output-structure locale-modules --emit-ts-declarations

      - name: Typecheck (tsc for shared/api/datagen, tsc6 + svelte-check for web)
        run: pnpm typecheck

      - name: Architecture rules (dependency-cruiser)
        run: pnpm arch:check

      - name: Unit and component tests (Vitest)
        run: pnpm test

      # apps/api has no build step — the server runs on tsx; only the web
      # app (and the shared data pipeline) produce build output.
      - name: Web production build (adapter-node)
        run: pnpm -C apps/web build

      - name: Install the diagram renderer's headless chrome
        # mermaid-cli 12.0.0 (pinned together with this puppeteer version in
        # scripts/check-diagrams.mjs) drives it for rendering; its
        # chrome-headless-shell is not bundled with the package download —
        # install it into the puppeteer cache. Keep this version equal to
        # PUPPETEER_VERSION in that script.
        run: pnpm dlx puppeteer@25.16.0 browsers install chrome-headless-shell

      - name: Diagram check (renderability of the in-doc mermaid sources)
        run: node scripts/check-diagrams.mjs

      - name: OpenSpec validate gate (all changes + specs, strict)
        run: npx -y @fission-ai/openspec@1.16.0 validate --all --strict

      - name: Prose reference check (backticked paths in docs + planning)
        # report-only until the planned-file references land; flips to
        # strict (exit 1 on stale) as its own change
        run: node scripts/check-references.mjs --report-only

  e2e:
    name: Compose e2e matrix
    runs-on: ubuntu-24.04
    # two compose image builds + browser installs + the full matrix; 45 min
    # gives software-GL headless suites ample headroom on runner cores
    timeout-minutes: 45
    env:
      # mesa software-GL fallthrough for Firefox/WebKit's MapLibre canvas;
      # Chromium carries its own SwiftShader launch args in the project config
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm + Node.js (pinned via package.json packageManager)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers + system deps
        run: pnpm -C apps/web exec playwright install --with-deps chromium firefox webkit

      - name: Boot API + web with Docker Compose
        run: |
          docker compose up -d --wait --wait-timeout 240
          docker compose ps

      # Firefox runs headed under this X server: headless Firefox on Linux
      # refuses every WebGL2 context ("AllowWebgl2:false restricts context
      # creation on this system"), which crashes MapLibre at boot and swaps
      # the page for the app's error boundary — every desktop-firefox spec
      # times out. Headed Firefox under Xvfb gets Mesa's llvmpipe and WebGL2
      # works. xvfb ships preinstalled on ubuntu-24.04 runners; the
      # playwright CI configs flip only the firefox project to headed, and
      # only on Linux CI. Chromium/WebKit stay headless and ignore DISPLAY.
      - name: BDD golden paths (generated from Gherkin features)
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" pnpm -C apps/web e2e:bdd:ci

      - name: Spec suite across the browser matrix
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" pnpm -C apps/web e2e:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down Compose
        if: always()
        run: docker compose down -v --remove-orphans
