# Full-suite run, manually dispatched (no schedule yet): everything the PR
# gate checks, plus the heavier add-ons that would slow every PR:
# - full e2e (same compose matrix as the PR gate) + the production-build
#   probe (`e2e:prod`, which builds the adapter-node output and serves it on
#   a scratch port against the compose API)
# - `pnpm audit` against the lockfile
# - datagen + model-doc determinism diffs (regenerate the frozen dataset and
#   the generated model reference; the working tree must stay byte-identical)
# - StrykerJS mutation testing scoped to packages/shared, apps/api and
#   tools/datagen. Report-only thresholds for now
#   (thresholds.break: null) — scores are observations, not gates, until a
#   deliberate review lands on numbers.

name: Full suite (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E matrix + production probe
    runs-on: ubuntu-24.04
    # compose builds + the browser matrix + the production probe (which
    # builds the web app another time); the matrix alone stays well below
    # 30 minutes locally
    timeout-minutes: 60
    env:
      # mesa software-GL fallthrough for Firefox/WebKit's MapLibre canvas;
      # Chromium carries its own SwiftShader launch args in the project config
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm + Node.js (pinned via package.json packageManager)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers + system deps
        run: pnpm -C apps/web exec playwright install --with-deps chromium firefox webkit

      # The production probe (`e2e:prod`) builds the adapter-node output and
      # serves it on a scratch port against a playwright-booted API whose
      # CORS list covers that port — so it runs BEFORE Compose (the Compose
      # API's fixed allow-list is 5173 only, and its ports collide with the
      # probe's self-booted dev webServers).
      - name: Production-build probe (adapter-node CSP + headers)
        run: pnpm -C apps/web e2e:prod

      - name: Boot API + web with Docker Compose
        run: |
          docker compose up -d --wait --wait-timeout 240
          docker compose ps

      # Firefox runs headed under this X server: headless Firefox on Linux
      # refuses every WebGL2 context ("AllowWebgl2:false restricts context
      # creation on this system"), which crashes MapLibre at boot and swaps
      # the page for the app's error boundary — every desktop-firefox spec
      # times out. Headed Firefox under Xvfb gets Mesa's llvmpipe and WebGL2
      # works. xvfb ships preinstalled on ubuntu-24.04 runners; the
      # playwright CI configs flip only the firefox project to headed, and
      # only on Linux CI. Chromium/WebKit stay headless and ignore DISPLAY.
      - name: BDD golden paths (generated from Gherkin features)
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" pnpm -C apps/web e2e:bdd:ci

      - name: Spec suite across the browser matrix
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" pnpm -C apps/web e2e:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down Compose
        if: always()
        run: docker compose down -v --remove-orphans

  audit:
    name: pnpm audit (dependency vulnerabilities)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm + Node.js (pinned via package.json packageManager)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Audit the complete dependency graph
        # The COMPLETE graph including dev tools. The six accepted dev-chain
        # advisories live (with removal instructions) in the
        # `audit.ignore` list in pnpm-workspace.yaml; every NEW advisory
        # fails this job (the list is a ratchet). The PR gate additionally
        # runs the strict production-only audit.
        run: pnpm audit

  determinism:
    name: Datagen + model-doc determinism (frozen diffs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm + Node.js (pinned via package.json packageManager)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Design tokens (lint + regeneration identity + hand-written drift)
        # Same gate as the PR check job: deterministic, needs only the
        # frozen install.
        run: pnpm design:check

      - name: Unit and component tests (Vitest, includes the blocking contrast suite)
        # design:check covers lint/export/drift; the WCAG token-pair suite
        # lives in the web Vitest tree, and this job otherwise never runs
        # the test suites — the spec requires the contrast suite behind
        # both CI entry points. The paraglide messages compile during the
        # vitest run itself (verified: fresh checkout, no compile step).
        run: pnpm test

      - name: Regenerate the dataset
        run: pnpm datagen

      - name: Assert byte-identical dataset regeneration
        run: git diff --exit-code -- data/

      - name: Regenerate the model reference
        run: pnpm docgen:model

      - name: Assert byte-identical model-doc regeneration
        run: git diff --exit-code -- docs/data-model.md

      - name: Prose reference check (backticked paths in docs + planning)
        # deterministic and dependency-free (plain Node); report-only until
        # the planned-file references land, strict later as its own change.
        # Sits in this job as the deterministic-gates job — this workflow
        # has no openspec validate step to sit beside.
        run: node scripts/check-references.mjs --report-only

  mutation:
    name: StrykerJS mutation (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm + Node.js (pinned via package.json packageManager)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Mutation testing (shared, api, datagen)
        run: node scripts/run-mutation.mjs

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
